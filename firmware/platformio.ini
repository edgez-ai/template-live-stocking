[platformio]
default_envs = heltec-hc33

[env:heltec-hc33]
; The Morse archive is compiled against ESP-IDF 5.5.1. Keep this exact
; pioarduino platform line; ESP-IDF 6 removes lwIP/mbedTLS symbols it uses.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
framework = espidf
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
platform_packages =
  platformio/tool-scons@4.40801.0
upload_protocol = esptool
upload_port = /dev/cu.usbserial-0001
; PlatformIO otherwise selects ota_0 even while otadata boots factory.
upload_command = $UPLOADER $UPLOADERFLAGS 0x10000 $SOURCE
;upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/esptool_remote.py
board_build.partitions = partitions.csv
build_flags =
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=1
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=1

; KeepTeen nRF54L15 with the prebuilt MM6108 Morse Micro HaLow stack.
[env:keepteen-nrf54l15]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
framework = zephyr
board = seeed-xiao-nrf54l15
build_src_filter = +<*>
upload_protocol = jlink
debug_tool = jlink
extra_scripts = pre:scripts/pre_build_firmware_nrf54.py
custom_morse_prebuilt = yes
monitor_speed = 115200
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF

; FGH200M (MM8108) carrier pinout from the edge-device-nrf54 reference.
[env:seeed-xiao-nrf54l15-fgh200m]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
framework = zephyr
board = seeed-xiao-nrf54l15
build_src_filter = +<*>
upload_protocol = jlink
debug_tool = jlink
extra_scripts = pre:scripts/pre_build_firmware_nrf54.py
custom_morse_chip = mm8108
custom_morse_prebuilt = yes
custom_zephyr_extra_conf = zephyr/fgh200m.conf
monitor_speed = 115200
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DDTC_OVERLAY_FILE=boards/xiao_nrf54l15_fgh200m.overlay
