# FGH200M / MM8108 firmware board configuration.
# The bundled SDK does not yet include Quectel's FGH200M-specific BCF. Use its
# standard MM8108 MF15457 BCF as a bring-up fallback until Quectel supplies the
# matching RF file; replace this value before RF validation/certification.
CONFIG_WIFI_MORSE_BCF="bcf_mf15457.mbin"
