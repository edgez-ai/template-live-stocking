CONFIG_CONSOLE=y
CONFIG_SERIAL=y
# Runtime diagnostics use SEGGER RTT, leaving the hardware UART for GPS.
CONFIG_UART_CONSOLE=n
CONFIG_UART_ASYNC_API=y
CONFIG_UART_LOG_LEVEL_DBG=y
CONFIG_PINCTRL_LOG_LEVEL_DBG=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_KERNEL_LOG_LEVEL_INF=y
CONFIG_CLOCK_CONTROL_LOG_LEVEL_WRN=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_PRINTK=y

# Keep app messages visible in runtime logs.
CONFIG_LOG_PROCESS_THREAD=n
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y

# SWD logging (RTT backend). Use a probe/viewer that supports SEGGER RTT.
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
# Do not block firmware execution when no RTT reader is attached. The larger
# transport/message buffers retain the provisioning startup burst instead.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_RTT_MESSAGE_SIZE=256
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=1024
CONFIG_RTT_CONSOLE=y

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_ADC=y
# edgez_imu uses a retryable direct-I2C path. The stock deferred driver records
# the first transient initialization failure permanently as -EALREADY.
CONFIG_LSM6DSL=n
CONFIG_REBOOT=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Persistent PhoneAPI config/NodeDB store.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_JSON_LIBRARY=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="EdgeZ"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=y
CONFIG_BT_FIXED_PASSKEY=n
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# Keep robust caching enabled so bonded Android clients retain the same GATT
# handle layout across firmware updates. Disabling it removes four Generic
# Attribute service handles and makes an existing Android cache write FFF2's
# CCC to the wrong handle (GATT_INVALID_HANDLE).
CONFIG_BT_GATT_CACHING=y
# Keep the noisy Zephyr host/controller internals at warning level. The
# edgez_ble application module remains INFO and logs every provisioning stage.
CONFIG_BT_LOG_LEVEL_WRN=y
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_WRN=y
CONFIG_BT_ATT_LOG_LEVEL_WRN=y
CONFIG_BT_GATT_LOG_LEVEL_WRN=y
CONFIG_BT_L2CAP_LOG_LEVEL_WRN=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_WRN=y
CONFIG_BT_CONN_LOG_LEVEL_WRN=y
CONFIG_BT_KEYS_LOG_LEVEL_WRN=y
CONFIG_BT_SERVICE_LOG_LEVEL_WRN=y
CONFIG_BT_L2CAP_TX_MTU=517
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_ATT_TX_COUNT=3
CONFIG_BT_ASSERT=n
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
CONFIG_POSIX_C_LIB_EXT=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=12288
CONFIG_BT_RX_STACK_SIZE=8192
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=4096
# Morse supplicant, BLE provisioning, and nanopb share Zephyr's system heap.
# The Morse module contributes 32 KiB; request 40 KiB total to retain scan-time headroom.
CONFIG_HEAP_MEM_POOL_SIZE=40960

# Networking and Wi-Fi HaLow
CONFIG_NETWORKING=y
CONFIG_NET_TX_STACK_SIZE=768
CONFIG_NET_RX_STACK_SIZE=768
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POLL_MAX=1
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_MAIN_THREAD_PRIORITY=14
CONFIG_SPI_LOG_LEVEL_WRN=y
CONFIG_SHELL=n
CONFIG_NET_SHELL=n
CONFIG_SHELL_STACK_SIZE=4096

CONFIG_WIFI=y
CONFIG_LOG_MAX_LEVEL=4
CONFIG_WIFI_LOG_LEVEL_INF=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_WIFI_SHELL=n
CONFIG_WIFI_MORSE_SM=y
CONFIG_WIFI_MORSE_FS=n
CONFIG_WIFI_MORSE_TEST=n
CONFIG_WIFI_MORSE_MESH_MODE=y
CONFIG_WIFI_MORSE_MESH_TRAFFIC_LOG=y
CONFIG_WIFI_MORSE_MESH_TRAFFIC_HEXDUMP_BYTES=64
CONFIG_WIFI_MORSE_REGION="US"
CONFIG_WIFI_MORSE_BCF="bcf_fgh100mhaamd.mbin"
CONFIG_WIFI_PSK=""
CONFIG_WIFI_SSID="edgez"

# Crypto used by the HaLow/Meshtastic packet path
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_SHA1=y
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_SHA512=y
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_ENTROPY_POLL_ZEPHYR=y
CONFIG_MBEDTLS_CIPHER=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_MODE_CTR_ENABLED=y
CONFIG_MBEDTLS_CMAC=y
CONFIG_MBEDTLS_MD=y
CONFIG_MBEDTLS_CTR_DRBG_ENABLED=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_PKCS5_C=y
CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="mbedtls_halow_config.h"

CONFIG_MMPKTMEM_TX_POOL_N_BLOCKS=10
CONFIG_MMPKTMEM_RX_POOL_N_BLOCKS=8
