name: Build firmware

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install PlatformIO and esptool
        run: python -m pip install platformio esptool
      - name: Build firmware
        run: pio run --project-dir firmware
      - name: Package firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/firmware
          build_dir=firmware/.pio/build/heltec-hc33
          cp "$build_dir/firmware.bin" dist/firmware/live-stocking-ota.bin
          python -m esptool --chip esp32s3 merge-bin \
            --output dist/firmware/live-stocking-flash.bin \
            --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x0 "$build_dir/bootloader.bin" \
            0x8000 "$build_dir/partitions.bin" \
            0x10000 "$build_dir/firmware.bin"
      - uses: actions/upload-artifact@v6
        with:
          name: live-stocking-firmware
          path: dist/firmware/*.bin
      - name: Attach firmware to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/firmware/live-stocking-flash.bin dist/firmware/live-stocking-ota.bin --clobber
