name: Build firmware

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install PlatformIO and esptool
        run: python -m pip install platformio==6.1.18 esptool
      - name: Build firmware
        run: pio run --project-dir firmware
      - name: Package firmware
        shell: bash
        run: bash firmware/scripts/package_esp32_release.sh
      - uses: actions/upload-artifact@v6
        with:
          name: live-stocking-firmware
          path: dist/firmware/*.bin
      - name: Attach firmware to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/firmware/live-stocking-flash.bin dist/firmware/live-stocking-ota.bin --clobber

  nrf54l15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Build KeepTeen nRF54L15 firmware
        run: pio run --project-dir firmware --environment keepteen-nrf54l15
      - name: Package nRF54L15 HEX
        shell: bash
        run: |
          set -euo pipefail
          source=firmware/.pio/build/keepteen-nrf54l15/firmware.hex
          test -s "$source"
          mkdir -p dist/firmware
          cp "$source" dist/firmware/live-stocking-nrf54l15.hex
      - uses: actions/upload-artifact@v6
        with:
          name: live-stocking-nrf54l15
          path: dist/firmware/live-stocking-nrf54l15.hex
      - name: Attach nRF54L15 HEX to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/firmware/live-stocking-nrf54l15.hex --clobber
