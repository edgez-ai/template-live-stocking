name: Build firmware

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build firmware
        run: pio run --project-dir firmware
      - name: Package firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/firmware
          find firmware/.pio/build/heltec_wifi_lora_32_V3 -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) \
            -exec cp {} dist/firmware/ \;
          tar -C dist -czf dist/iot-provisioning-firmware.tar.gz firmware
      - uses: actions/upload-artifact@v4
        with:
          name: iot-provisioning-firmware
          path: dist/iot-provisioning-firmware.tar.gz
      - name: Attach firmware to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/iot-provisioning-firmware.tar.gz --clobber
