name: Build firmware

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install PlatformIO and esptool
        run: python -m pip install platformio==6.1.18 esptool
      - name: Build firmware
        run: pio run --project-dir firmware
      - name: Package firmware
        shell: bash
        run: bash firmware/scripts/package_esp32_release.sh
      - uses: actions/upload-artifact@v6
        with:
          name: live-stocking-firmware
          path: dist/firmware/*.bin
      - name: Attach firmware to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/firmware/live-stocking-flash.bin dist/firmware/live-stocking-ota.bin --clobber

  fgh200m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private Morse MM8108 source
        uses: actions/checkout@v5
        with:
          repository: edgez-ai/mm-iot-zephyr
          ref: 539d6b2550d7c63b2140a5b5ce8b6cb8e019a604
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          path: firmware/modules/mm-iot-zephyr
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Build FGH200M firmware
        run: pio run --project-dir firmware --environment seeed-xiao-nrf54l15-fgh200m
      - name: Package FGH200M HEX
        shell: bash
        run: |
          set -euo pipefail
          source=firmware/.pio/build/seeed-xiao-nrf54l15-fgh200m/firmware.hex
          test -s "$source"
          mkdir -p dist/firmware
          cp "$source" dist/firmware/live-stocking-fgh200m.hex
      - uses: actions/upload-artifact@v6
        with:
          name: live-stocking-fgh200m
          path: dist/firmware/live-stocking-fgh200m.hex
      - name: Attach FGH200M HEX to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/firmware/live-stocking-fgh200m.hex --clobber
