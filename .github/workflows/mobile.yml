name: Build mobile app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      DOMAIN_SUFFIX: edgez.biz
      APPWRITE_ENDPOINT: https://appwrite.edgez.ai/v1
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID || secrets.APPWRITE_PROJECT_ID }}
      CI: "1"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v5
      - name: Check Appwrite project ID
        run: |
          if [[ -z "$APPWRITE_PROJECT_ID" ]]; then
            echo 'Set the repository Actions variable or secret APPWRITE_PROJECT_ID to the deployed Appwrite project ID.' >&2
            exit 1
          fi
      - name: Check Android signing credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" ]]; then
            echo 'Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets and the ANDROID_KEY_ALIAS variable.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install mobile dependencies
        working-directory: app
        run: npm ci
      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --clean --no-install
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build unsigned APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: bash app/scripts/sign-android-release.sh
      - uses: actions/upload-artifact@v6
        with:
          name: live-stocking-mobile
          path: dist/mobile/*.apk
      - name: Attach mobile builds to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/mobile/live-stocking-signed.apk dist/mobile/live-stocking-unsigned.apk --clobber
